name: Windows build and test release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Check version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/DuoLaBox/DuoLaBox.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match project version v$version"
          }
      - name: Build solution
        run: dotnet build DuoLaBox.sln --configuration Release
      - name: Run isolated regression checks
        run: dotnet run --project tests/DuoLaBox.RegressionVerification --configuration Release --no-build
      - name: Run clipboard checks on disposable runner
        run: dotnet run --project tests/DuoLaBox.ClipboardVerification --configuration Release --no-build -- --allow-clipboard-write
      # x86 covers 32-bit Windows 10 and Windows 10 on ARM, which cannot emulate x64.
      - name: Publish and package portable builds
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/DuoLaBox/DuoLaBox.csproj
          $version = $project.Project.PropertyGroup.Version
          $sums = foreach ($rid in 'win-x64', 'win-x86', 'win-arm64') {
            dotnet publish src/DuoLaBox/DuoLaBox.csproj --configuration Release --runtime $rid --self-contained true --output "artifacts/$rid"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed for $rid" }
            Copy-Item LICENSE, README.md "artifacts/$rid/"
            $file = "DuoLaBox-$version-$rid.zip"
            Compress-Archive -Path "artifacts/$rid/*" -DestinationPath "artifacts/$file"
            $hash = (Get-FileHash "artifacts/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          $sums | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-portable
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-portable
          path: artifacts
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*.zip artifacts/SHA256SUMS.txt \
            --verify-tag --prerelease --title "DuoLaBox $GITHUB_REF_NAME 测试版" \
            --notes-file RELEASE_NOTES.md
